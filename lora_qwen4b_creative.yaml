# Qwen3.5-4B `creative` adapter (right hemisphere) — divergent/vivid mode.
# 9B-distilled creative data + light replay. Swap-in mode adapter; serve at
# moderate temp (~0.6-0.7) + creative system prompt.
model: "mlx-community/Qwen3.5-4B-MLX-4bit"
train: true
data: "data_creative"
fine_tune_type: lora
num_layers: 32
batch_size: 1
grad_checkpoint: true
iters: 250
val_batches: 6
learning_rate: 5.0e-5
steps_per_report: 25
steps_per_eval: 100
adapter_path: "adapters_qwen4b_creative"
max_seq_length: 768
lr_schedule:
  name: cosine_decay
  warmup: 25
  warmup_init: 1.0e-7
  arguments: [5.0e-5, 250, 5.0e-6]
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.k_proj"
    - "self_attn.v_proj"
    - "self_attn.o_proj"
    - "mlp.gate_proj"
    - "mlp.up_proj"
    - "mlp.down_proj"
  rank: 8
  scale: 16.0
  dropout: 0.05
