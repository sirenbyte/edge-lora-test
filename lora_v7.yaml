# v7: reasoning-effort dial (#1) + WSD lr-schedule (#3) + identity over-rep (#4).
# Experts frozen (v3 recipe) so world-knowledge doesn't drift.
model: "LFM2.5-8B-A1B-mlx-4bit"
train: true
data: "data7"
fine_tune_type: lora
num_layers: 24
batch_size: 2
iters: 500
val_batches: 8
learning_rate: 2e-5        # fallback; lr_schedule below overrides
steps_per_report: 25
steps_per_eval: 125
adapter_path: "adapters_lfm2_v7"
max_seq_length: 640
# #3 WSD-style: warmup -> decay (mlx-lm has no native "stable" phase, so
# this is warmup + cosine decay — captures the W and D of warmup-stable-decay).
lr_schedule:
  name: cosine_decay
  warmup: 60
  warmup_init: 1.0e-7
  arguments: [2.0e-5, 500, 2.0e-6]
lora_parameters:
  keys:
    - "conv.in_proj"
    - "conv.out_proj"
    - "self_attn.q_proj"
    - "self_attn.v_proj"
  rank: 8
  scale: 10.0
  dropout: 0.05
