# v8 = ALL 4 in one artifact: v7 recipe (dial #1 + WSD #3 + identity #4)
# trained ON the mixed-precision base (#2). One model, all techniques.
model: "LFM2.5-8B-A1B-mlx-mixed"        # #2 mixed base (experts 4-bit, rest 8-bit)
train: true
data: "data7"
fine_tune_type: lora
num_layers: 24
batch_size: 2
iters: 500
val_batches: 8
learning_rate: 2e-5
steps_per_report: 25
steps_per_eval: 125
adapter_path: "adapters_lfm2_v8"
max_seq_length: 640
lr_schedule:                             # #3 WSD-style
  name: cosine_decay
  warmup: 60
  warmup_init: 1.0e-7
  arguments: [2.0e-5, 500, 2.0e-6]
lora_parameters:
  keys:
    - "conv.in_proj"
    - "conv.out_proj"
    - "self_attn.q_proj"
    - "self_attn.v_proj"
  rank: 8
  scale: 10.0
  dropout: 0.05
